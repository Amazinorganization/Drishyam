name: Build Drishyam Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor Android tools
        run: npm install @capacitor/android@^7.4.3 @capacitor/core@^7.4.3 @capacitor/cli@^7.4.3 @capacitor/app@^7.0.0

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android
    
      - name: Configure Drishyam Deep Link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          tree = ET.parse(manifest)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element not found")

          activity = next(
              (
                  item for item in app.findall("activity")
                  if item.get(android + "name", "").endswith("MainActivity")
              ),
              None,
          )
          if activity is None:
              raise SystemExit("MainActivity not found")

          for item in activity.findall("intent-filter"):
              data = item.find("data")
              if data is not None and data.get(android + "scheme") == "com.drishyam.app":
                  print("Deep link already configured.")
                  break
          else:
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {android + "name": "android.intent.action.VIEW"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.BROWSABLE"})
              ET.SubElement(intent, "data", {
                  android + "scheme": "com.drishyam.app",
                  android + "host": "login-callback",
              })
              tree.write(manifest, encoding="utf-8", xml_declaration=True)
              print("Drishyam Deep Link configured.")
          PY
              
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7