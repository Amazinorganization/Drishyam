name: Build Drishyam Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/app@^7.0.0

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor Android tools
        run: npm install @capacitor/android@^7.4.3 @capacitor/core@^7.4.3 @capacitor/cli@^7.4.3 @capacitor/app@^7.0.0

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android
      
      - name: Configure Drishyam App Icon
        run: |
          mkdir -p resources
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("drishyam-icon-1024-1.png")
          resources = Path("resources")
          resources.mkdir(parents=True, exist_ok=True)

          if not source.exists():
              raise SystemExit("ERROR: drishyam-icon-1024-1.png not found in repository root")

          shutil.copy2(source, resources / "icon.png")
          print("Drishyam icon copied successfully.")
          PY

          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
    
      - name: Configure Drishyam Deep Link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          content = manifest.read_text(encoding="utf-8")

          if 'android:scheme="com.drishyam.app"' in content:
              print("Deep link already configured.")
          else:
              pattern = r'(<activity\b[^>]*\bandroid:name="[^"]*MainActivity"[^>]*>)'
              match = re.search(pattern, content)

              if not match:
                  raise SystemExit("MainActivity opening tag not found")

              deep_link = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.drishyam.app" android:host="login-callback" />
                      </intent-filter>
              """

              position = match.end()
              content = content[:position] + deep_link + content[position:]
              manifest.write_text(content, encoding="utf-8")
              print("Drishyam Deep Link configured.")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7