name: Build Drishyam Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor Android tools
        run: npm install @capacitor/android@^7.4.3 @capacitor/core@^7.4.3 @capacitor/cli@^7.4.3

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android
              - name: Configure Android Deep Links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          marker = 'android:scheme="com.drishyam.app"'
          if marker not in content:
              intent_filter = '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.drishyam.app" android:host="login-callback" />
                      </intent-filter>
              '''

              activity_end = content.find('</activity>')
              if activity_end == -1:
                  raise SystemExit("Could not find MainActivity in AndroidManifest.xml")

              content = content[:activity_end] + intent_filter + content[activity_end:]
              manifest.write_text(content)

          print("Deep Link configured successfully")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7